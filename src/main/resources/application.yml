spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      # Override via HIKARI_MAX_POOL_SIZE env var. Production should set this to match
      # the DB server's max_connections budget. Local dev default covers Gatling load
      # testing at ~333 rps with 2× headroom for GC spikes; rotation batch parallelism (8)
      # needs pool ≥ 13 minimum.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:60}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      # Flyway owns schema management — Hibernate validates only, never modifies
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      # Virtual threads let Tomcat handle high concurrency without a fixed thread pool.
      # Disabled by default; set VIRTUAL_THREADS_ENABLED=true for load testing.
      enabled: ${VIRTUAL_THREADS_ENABLED:false}

kms:
  # Supported values: aws | local-dev
  # azure-kv is a stub, not yet implemented
  provider: ${KMS_PROVIDER:aws}
  aws:
    region: ${AWS_REGION:ap-southeast-2}
    master-key-arn: ${AWS_KMS_KEY_ARN:}
  local-dev:
    # 64-char hex string (32 bytes). Set KMS_LOCAL_DEV_KEK_HEX in env; only used when KMS_PROVIDER=local-dev.
    # No default — KMS_LOCAL_DEV_KEK_HEX must be set explicitly when KMS_PROVIDER=local-dev.
    # A hardcoded fallback would silently use a known key in production, violating PCI-DSS key secrecy.
    kek-hex: ${KMS_LOCAL_DEV_KEK_HEX}
  key-ring:
    # Force re-fetch of KEK from KMS after this many hours
    ttl-hours: 24
    # Fail fast at startup if KMS is unreachable
    startup-timeout-seconds: 30

tokenisation:
  # Token format — UUID (default) or LUHN_16
  token-format: UUID
  # HMAC-SHA256 hashing secret for PAN de-dup (required on first boot; optional after HMAC key is seeded)
  pan-hash-secret: ${PAN_HASH_SECRET:#{null}}
  # Default token lifetime (5 years)
  default-token-ttl-days: 1825
  # Accepted card scheme codes — add entries here to enable additional schemes without code changes
  allowed-card-schemes:
    - MC

detokenisation:
  rate-limit:
    per-service-per-minute: 10000

rotation:
  batch:
    # Run rotation batch every 15 minutes
    cron: "0 */15 * * * *"
    size: 500
    # Smaller batches during emergency rotation for faster re-encryption
    emergency-size: 100
    # Parallel virtual threads for DEK rewrap within one batch (must be ≤ HIKARI_MAX_POOL_SIZE − 5)
    parallelism: 8
    # 0 = drain all remaining records in one cron invocation; positive = cap batches per tick
    max-batches-per-run: 0
  hmac-batch:
    # Run HMAC rotation batch at 02:00 UTC (off-peak)
    cron: "0 0 2 * * *"
    size: 100
    parallelism: 4
    max-batches-per-run: 0
  compliance:
    max-key-age-days: 365

audit:
  # PCI-DSS minimum retention period
  retention-years: 7

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.yourorg.tokenisation: INFO
  # PAN masking TurboFilter is registered in logback-spring.xml — applied globally
