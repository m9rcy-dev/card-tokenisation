services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tokenisation
      POSTGRES_USER: tokenisation_app
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenisation_app -d tokenisation"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: kms
      DEFAULT_REGION: ap-southeast-2
      # Set LOCALSTACK_AUTH_TOKEN in your environment for LocalStack Pro features (not required for KMS)
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./scripts/localstack-init-kms.sh:/etc/localstack/init/ready.d/01-init-kms.sh
      - localstack-tmp:/tmp/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q 'running'"]
      interval: 5s
      timeout: 10s
      retries: 15

volumes:
  # Shared volume so the init hook can write the KMS key ARN and the host can read it
  localstack-tmp:
